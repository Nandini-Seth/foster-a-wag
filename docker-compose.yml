# Local Postgres, so development runs against the same engine as Cloud SQL.
#
#   npm run db:up
#   npm run migrate
#   ALLOW_SEED=true npm run seed
#   npm run dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fosterawag
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d fosterawag']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
